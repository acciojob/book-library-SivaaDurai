
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Library</title>
    <style>
        body {
            background-color: #f8f8f8;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .book-library {
            background-color: #ffffff;
            padding: 20px;
            text-align: center;
        }

        .book {
            background-color: #ffffff;
            padding: 15px;
            margin: 20px auto;
            width: 250px;
        }

        .book img {
            width: 200px;
            height: 300px;
            object-fit: cover;
        }

        .book h2 {
            font-size: 20px;
            margin: 10px 0;
        }

        .book .author {
            color: #777777;
            font-size: 14px;
        }

        .book .price-block {
            color: #2ecc71;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="book-library">
        <div class="book">
            <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Spy-in-the-Amber-by-Manohar-Malgonkar.jpg" alt="Spy in the Amber">
            <h2>Spy in the Amber</h2>
            <p class="author">by Manohar Malgonkar</p>
            <p class="price-block">₹299</p>
        </div>

        <div class="book">
            <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Sacred-Games-by-Vikram-Chandra.jpg" alt="Sacred Games">
            <h2>Sacred Games</h2>
            <p class="author">by Vikram Chandra</p>
            <p class="price-block">₹499</p>
        </div>

        <div class="book">
            <img src="https://www.bookgeeks.in/wp-content/uploads/2018/01/Byomkesh-Bakshi-by-Sharadindu-Bandyopadhyay.jpg" alt="Byomkesh Bakshi">
            <h2>Byomkesh Bakshi</h2>
            <p class="author">by Sharadindu Bandyopadhyay</p>
            <p class="price-block">₹199</p>
        </div>
    </div>
</body>
</html>
